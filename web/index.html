<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eyra — Visual Image Memory</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
        }

        /* Header */
        .header {
            padding: 1.5rem 2rem;
            text-align: center;
            border-bottom: 1px solid #1a1a2e;
            position: sticky;
            top: 0;
            background: #0a0a0f;
            z-index: 50;
        }
        .header h1 {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.3rem;
        }
        .header p {
            color: #888;
            font-size: 0.85rem;
        }

        /* Search */
        .search-container {
            max-width: 700px;
            margin: 1.5rem auto;
            padding: 0 1rem;
        }
        .search-box {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }
        .search-box input {
            flex: 1;
            padding: 0.7rem 1rem;
            border: 1px solid #2a2a3e;
            border-radius: 10px;
            background: #12121a;
            color: #e0e0e0;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .search-box input:focus { border-color: #667eea; }
        .search-box button {
            padding: 0.7rem 1.2rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 0.95rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .search-box button:hover { opacity: 0.9; }

        /* Mode Toggle */
        .mode-toggle {
            display: flex;
            gap: 0;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            overflow: hidden;
            margin-top: 0.6rem;
            justify-content: center;
        }
        .mode-btn {
            padding: 0.35rem 0.8rem;
            background: transparent;
            color: #888;
            border: none;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.2s;
        }
        .mode-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .mode-btn:hover:not(.active) { color: #ccc; }

        /* Filter Bar */
        .filter-bar {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 0.6rem;
            flex-wrap: wrap;
        }
        .filter-bar select, .filter-bar input[type="number"] {
            padding: 0.3rem 0.5rem;
            border: 1px solid #2a2a3e;
            border-radius: 6px;
            background: #12121a;
            color: #ccc;
            font-size: 0.75rem;
            outline: none;
        }
        .filter-bar select:focus, .filter-bar input[type="number"]:focus {
            border-color: #667eea;
        }

        /* Stats Bar */
        .stats-bar {
            text-align: center;
            color: #666;
            font-size: 0.8rem;
            margin: 0.5rem 0;
        }

        /* Task Panel */
        .task-panel {
            max-width: 700px;
            margin: 0 auto 0.5rem;
            padding: 0 1rem;
        }
        .task-card {
            background: #12121a;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            padding: 0.6rem 0.8rem;
            margin-bottom: 0.4rem;
            font-size: 0.8rem;
        }
        .task-card .task-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.3rem;
        }
        .task-card .task-type {
            color: #667eea;
            font-weight: 600;
        }
        .task-card .task-status {
            font-size: 0.7rem;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
        }
        .task-status.running { background: #1a3a2e; color: #4ade80; }
        .task-status.pending { background: #3a3a1e; color: #facc15; }
        .task-status.completed { background: #1a2a3e; color: #60a5fa; }
        .task-status.failed { background: #3a1a1e; color: #f87171; }
        .task-progress-bar {
            height: 4px;
            background: #1a1a2e;
            border-radius: 2px;
            overflow: hidden;
            margin-top: 0.3rem;
        }
        .task-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s;
        }
        .task-message { color: #888; margin-top: 0.2rem; }

        /* Results Grid */
        .results {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
            columns: 4;
            column-gap: 1rem;
        }
        @media (max-width: 900px) { .results { columns: 3; } }
        @media (max-width: 600px) { .results { columns: 2; } }

        .result-card {
            break-inside: avoid;
            margin-bottom: 1rem;
            border-radius: 10px;
            overflow: hidden;
            background: #12121a;
            border: 1px solid #1a1a2e;
            transition: transform 0.2s, border-color 0.2s;
            cursor: pointer;
        }
        .result-card:hover {
            transform: translateY(-2px);
            border-color: #667eea;
        }
        .result-card img {
            width: 100%;
            display: block;
        }
        .result-info {
            padding: 0.5rem 0.7rem;
        }
        .result-info .filename {
            font-size: 0.75rem;
            color: #aaa;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .result-info .similarity {
            font-size: 0.7rem;
            color: #667eea;
            font-weight: 600;
        }
        .result-info .caption {
            font-size: 0.7rem;
            color: #bbb;
            margin-top: 0.2rem;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .result-info .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.2rem;
            margin-top: 0.25rem;
        }
        .result-info .tag {
            font-size: 0.6rem;
            padding: 0.1rem 0.35rem;
            background: #1a1a2e;
            border-radius: 5px;
            color: #8888cc;
            white-space: nowrap;
        }

        /* Load More */
        .load-more {
            text-align: center;
            padding: 2rem;
        }
        .load-more button {
            padding: 0.6rem 2rem;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            background: transparent;
            color: #888;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .load-more button:hover {
            border-color: #667eea;
            color: #667eea;
        }
        .load-more .loading-text {
            color: #667eea;
            font-size: 0.85rem;
        }

        /* Empty State */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #555;
        }
        .empty-state h2 {
            font-size: 1.3rem;
            margin-bottom: 0.4rem;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.92);
            z-index: 100;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }
        .modal.active { display: flex; }
        .modal img {
            max-width: 90vw;
            max-height: 85vh;
            border-radius: 8px;
        }
        .modal-info {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem 2rem;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            color: #ccc;
            font-size: 0.8rem;
        }
        .modal-info .modal-caption { color: #ddd; margin-bottom: 0.3rem; }
        .modal-info .modal-path { color: #888; font-size: 0.7rem; }
        .modal-close {
            position: fixed;
            top: 1rem; right: 1.5rem;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            z-index: 101;
        }
        .modal-nav {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            font-size: 2.5rem;
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            z-index: 101;
            user-select: none;
            transition: color 0.2s;
        }
        .modal-nav:hover { color: #fff; }
        .modal-nav.prev { left: 1rem; }
        .modal-nav.next { right: 1rem; }

        /* Tab Navigation */
        .tab-bar {
            display: flex;
            justify-content: center;
            gap: 0;
            max-width: 700px;
            margin: 0 auto;
            padding: 0 1rem;
            border-bottom: 1px solid #1a1a2e;
        }
        .tab-btn {
            padding: 0.6rem 1.2rem;
            background: transparent;
            color: #666;
            border: none;
            border-bottom: 2px solid transparent;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }
        .tab-btn:hover:not(.active) { color: #aaa; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Chat Panel */
        .chat-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 200px);
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1rem 0;
        }
        .chat-msg {
            margin-bottom: 1rem;
            padding: 0.8rem 1rem;
            border-radius: 12px;
            max-width: 85%;
        }
        .chat-msg.user {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .chat-msg.assistant {
            background: #12121a;
            border: 1px solid #2a2a3e;
            border-bottom-left-radius: 4px;
        }
        .chat-msg .msg-text { font-size: 0.9rem; line-height: 1.5; }
        .chat-msg .msg-images {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 0.5rem;
            margin-top: 0.8rem;
        }
        .chat-msg .msg-images img {
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .chat-msg .msg-images img:hover { transform: scale(1.05); }
        .chat-input-bar {
            display: flex;
            gap: 0.5rem;
            padding: 0.8rem 0;
            border-top: 1px solid #1a1a2e;
        }
        .chat-input-bar input {
            flex: 1;
            padding: 0.7rem 1rem;
            border: 1px solid #2a2a3e;
            border-radius: 10px;
            background: #12121a;
            color: #e0e0e0;
            font-size: 0.95rem;
            outline: none;
        }
        .chat-input-bar input:focus { border-color: #667eea; }
        .chat-input-bar button {
            padding: 0.7rem 1.5rem;
            border: none;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 0.95rem;
            cursor: pointer;
        }

        /* Cluster View */
        .clusters-grid {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }
        .cluster-group {
            margin-bottom: 2rem;
        }
        .cluster-header {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid #1a1a2e;
        }
        .cluster-label {
            font-size: 1.1rem;
            font-weight: 600;
            color: #667eea;
        }
        .cluster-count {
            font-size: 0.8rem;
            color: #666;
            background: #12121a;
            padding: 0.15rem 0.5rem;
            border-radius: 10px;
        }
        .cluster-images {
            columns: 4;
            column-gap: 0.8rem;
        }
        @media (max-width: 900px) { .cluster-images { columns: 3; } }
        @media (max-width: 600px) { .cluster-images { columns: 2; } }
        .cluster-run-btn {
            display: block;
            margin: 2rem auto;
            padding: 0.7rem 2rem;
            border: 1px solid #2a2a3e;
            border-radius: 10px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
        }

        /* Timeline View */
        .timeline-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1rem;
        }
        .timeline-group {
            margin-bottom: 2rem;
            position: relative;
            padding-left: 2rem;
        }
        .timeline-group::before {
            content: '';
            position: absolute;
            left: 0.5rem;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #2a2a3e;
        }
        .timeline-dot {
            position: absolute;
            left: 0.15rem;
            top: 0.5rem;
            width: 0.7rem;
            height: 0.7rem;
            border-radius: 50%;
            background: #667eea;
        }
        .timeline-date {
            font-size: 1rem;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 0.3rem;
        }
        .timeline-count {
            font-size: 0.8rem;
            color: #666;
            margin-bottom: 0.6rem;
        }
        .timeline-images {
            columns: 4;
            column-gap: 0.6rem;
        }
        @media (max-width: 900px) { .timeline-images { columns: 3; } }
        @media (max-width: 600px) { .timeline-images { columns: 2; } }
        .timeline-controls {
            text-align: center;
            margin-bottom: 1rem;
        }
        .timeline-controls select {
            padding: 0.4rem 0.8rem;
            border: 1px solid #2a2a3e;
            border-radius: 8px;
            background: #12121a;
            color: #ccc;
            font-size: 0.85rem;
            outline: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>👁️ Eyra</h1>
        <p>Local-first AI image memory — search by meaning, not filename</p>
    </div>

    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('browse')">🔍 Browse</button>
        <button class="tab-btn" onclick="switchTab('clusters')">🧩 Clusters</button>
        <button class="tab-btn" onclick="switchTab('chat')">💬 Chat</button>
        <button class="tab-btn" onclick="switchTab('timeline')">📅 Timeline</button>
    </div>

    <!-- Browse Tab (existing) -->
    <div class="tab-content active" id="tab-browse">

    <div class="search-container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Describe what you're looking for..." autofocus>
            <button onclick="doSearch()">Search</button>
        </div>
        <div class="mode-toggle">
            <button class="mode-btn active" data-mode="hybrid" onclick="setMode('hybrid')">🔀 Hybrid</button>
            <button class="mode-btn" data-mode="vector" onclick="setMode('vector')">🧠 Vector</button>
            <button class="mode-btn" data-mode="keyword" onclick="setMode('keyword')">🏷️ Tags</button>
            <button class="mode-btn" data-mode="text" onclick="setMode('text')">📝 Text</button>
        </div>
        <div class="filter-bar">
            <select id="sortBy" onchange="resetAndLoad()">
                <option value="indexed_at">Newest indexed</option>
                <option value="filename">Filename</option>
                <option value="size_bytes">File size</option>
                <option value="width">Width</option>
                <option value="height">Height</option>
            </select>
            <select id="filterCaption" onchange="resetAndLoad()">
                <option value="">All images</option>
                <option value="true">Has caption</option>
                <option value="false">No caption</option>
            </select>
            <select id="filterFormat" onchange="resetAndLoad()">
                <option value="">All formats</option>
            </select>
        </div>
        <div class="stats-bar" id="statsBar">Loading...</div>
    </div>

    <div class="task-panel" id="taskPanel"></div>
    <div class="results" id="results"></div>
    <div class="load-more" id="loadMore" style="display:none">
        <button onclick="loadMore()">Load more</button>
    </div>

    <!-- Clusters Tab -->
    <div class="tab-content" id="tab-clusters">
        <div class="clusters-grid" id="clustersGrid">
            <div class="empty-state">
                <h2>Visual Clusters</h2>
                <p>Group your images by visual similarity</p>
                <button class="cluster-run-btn" onclick="runClustering()">🧩 Run Clustering</button>
            </div>
        </div>
    </div>

    <!-- Chat Tab -->
    <div class="tab-content" id="tab-chat">
        <div class="chat-container">
            <div class="chat-messages" id="chatMessages">
                <div class="chat-msg assistant">
                    <div class="msg-text">Hi! Describe what you're looking for and I'll find matching images from your library. 🔍</div>
                </div>
            </div>
            <div class="chat-input-bar">
                <input type="text" id="chatInput" placeholder="Ask about your images..." autofocus>
                <button onclick="sendChat()">Send</button>
            </div>
        </div>
    </div>

    <!-- Timeline Tab -->
    <div class="tab-content" id="tab-timeline">
        <div class="timeline-container">
            <div class="timeline-controls">
                <select id="timelineGroup" onchange="loadTimeline()">
                    <option value="month">By Month</option>
                    <option value="year">By Year</option>
                    <option value="day">By Day</option>
                </select>
            </div>
            <div id="timelineContent">
                <div class="empty-state">
                    <h2>Timeline</h2>
                    <p>Browse your images by date</p>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="modal" onclick="closeModal(event)">
        <span class="modal-close" onclick="closeModal(event)">&times;</span>
        <span class="modal-nav prev" onclick="navModal(-1, event)">‹</span>
        <span class="modal-nav next" onclick="navModal(1, event)">›</span>
        <img id="modalImg" src="" alt="">
        <div class="modal-info">
            <div class="modal-caption" id="modalCaption"></div>
            <div class="modal-path" id="modalPath"></div>
        </div>
    </div>

    <script>
        const resultsDiv = document.getElementById('results');
        const searchInput = document.getElementById('searchInput');
        const statsBar = document.getElementById('statsBar');
        const loadMoreDiv = document.getElementById('loadMore');
        const taskPanel = document.getElementById('taskPanel');

        let searchMode = 'hybrid';
        let currentItems = [];
        let currentOffset = 0;
        let currentTotal = 0;
        let isLoading = false;
        let currentModalIndex = -1;
        const PAGE_SIZE = 50;

        // Init
        loadStats();
        loadFormats();
        loadAllImages();
        pollTasks();
        setInterval(pollTasks, 3000);

        // Infinite scroll
        window.addEventListener('scroll', () => {
            if (isLoading) return;
            const scrollBottom = window.innerHeight + window.scrollY;
            const docHeight = document.documentElement.scrollHeight;
            if (scrollBottom >= docHeight - 400 && currentOffset < currentTotal) {
                loadMore();
            }
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') doSearch();
        });

        async function loadStats() {
            try {
                const r = await fetch('/api/stats');
                const d = await r.json();
                let text = `${d.total_images} images`;
                if (d.captioned > 0) text += ` · ${d.captioned} captioned`;
                if (d.total_size_bytes > 0) {
                    const mb = (d.total_size_bytes / (1024*1024)).toFixed(0);
                    text += ` · ${mb} MB`;
                }
                statsBar.textContent = text;
            } catch(e) { statsBar.textContent = 'Server not running'; }
        }

        async function loadFormats() {
            try {
                const r = await fetch('/api/stats');
                const d = await r.json();
                const sel = document.getElementById('filterFormat');
                if (d.formats) {
                    for (const [fmt, count] of Object.entries(d.formats)) {
                        const opt = document.createElement('option');
                        opt.value = fmt;
                        opt.textContent = `${fmt} (${count})`;
                        sel.appendChild(opt);
                    }
                }
            } catch(e) {}
        }

        function setMode(mode) {
            searchMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            if (searchInput.value.trim()) doSearch();
        }

        function resetAndLoad() {
            currentOffset = 0;
            currentItems = [];
            resultsDiv.innerHTML = '';
            if (searchInput.value.trim()) {
                doSearch();
            } else {
                loadAllImages();
            }
        }

        async function loadAllImages() {
            if (isLoading) return;
            isLoading = true;
            loadMoreDiv.innerHTML = '<span class="loading-text">Loading...</span>';
            loadMoreDiv.style.display = 'block';

            const orderBy = document.getElementById('sortBy').value;
            const hasCaption = document.getElementById('filterCaption').value;
            const fmt = document.getElementById('filterFormat').value;

            let url = `/api/images?limit=${PAGE_SIZE}&offset=${currentOffset}&order_by=${orderBy}`;
            if (hasCaption) url += `&has_caption=${hasCaption}`;
            if (fmt) url += `&fmt=${fmt}`;

            try {
                const res = await fetch(url);
                const data = await res.json();
                currentTotal = data.total;

                if (data.images && data.images.length > 0) {
                    const items = data.images.map(img => ({
                        path: img.path,
                        filename: img.filename,
                        thumbnail: img.thumbnail || '/api/thumbnail?path=' + encodeURIComponent(img.path),
                        similarity: null,
                        caption: img.caption || '',
                        tags: img.tags || [],
                    }));
                    currentItems = currentItems.concat(items);
                    renderResults(items, true);
                }

                currentOffset += data.images.length;
                updateLoadMore();
                statsBar.textContent = `${currentOffset} of ${currentTotal} images`;
            } catch(e) {
                loadMoreDiv.innerHTML = '<span style="color:#f87171">Failed to load</span>';
            }
            isLoading = false;
        }

        function loadMore() {
            if (searchInput.value.trim()) {
                // Search doesn't support infinite scroll yet (results are fixed)
                return;
            }
            loadAllImages();
        }

        function updateLoadMore() {
            if (currentOffset < currentTotal) {
                loadMoreDiv.innerHTML = '<button onclick="loadMore()">Load more</button>';
                loadMoreDiv.style.display = 'block';
            } else {
                loadMoreDiv.style.display = 'none';
            }
        }

        async function doSearch() {
            const query = searchInput.value.trim();
            if (!query) { resetAndLoad(); return; }

            isLoading = true;
            resultsDiv.innerHTML = '<div class="empty-state"><h2>Searching...</h2></div>';
            loadMoreDiv.style.display = 'none';

            try {
                let data;
                if (searchMode === 'text') {
                    // FTS5 text search
                    const res = await fetch(`/api/search/text?q=${encodeURIComponent(query)}&limit=200`);
                    data = await res.json();
                    data.results = data.images;
                    data.count = data.total;
                } else {
                    const res = await fetch(`/api/search?q=${encodeURIComponent(query)}&mode=${searchMode}&limit=200`);
                    data = await res.json();
                }

                if (!data.results || data.results.length === 0) {
                    resultsDiv.innerHTML = '<div class="empty-state"><h2>No results</h2><p>Try a different query</p></div>';
                    currentItems = [];
                    return;
                }

                currentItems = data.results.map(r => ({
                    path: r.path,
                    filename: r.filename || r.metadata?.filename || '',
                    thumbnail: r.thumbnail || '/api/thumbnail?path=' + encodeURIComponent(r.path),
                    similarity: r.similarity,
                    caption: r.caption || r.metadata?.caption || '',
                    tags: r.tags || [],
                }));

                resultsDiv.innerHTML = '';
                renderResults(currentItems, false);
                statsBar.textContent = `${data.count} results for "${query}" (${searchMode})`;
            } catch(e) {
                resultsDiv.innerHTML = '<div class="empty-state"><h2>Error</h2><p>Search failed</p></div>';
            }
            isLoading = false;
        }

        function renderResults(items, append) {
            const html = items.map((item, i) => `
                <div class="result-card" onclick="openModal(${append ? currentItems.length - items.length + i : i})">
                    <img src="${item.thumbnail}" alt="${item.filename || ''}" loading="lazy">
                    <div class="result-info">
                        <div class="filename">${item.filename || ''}</div>
                        ${item.similarity !== null && item.similarity !== undefined ? `<div class="similarity">${(item.similarity * 100).toFixed(1)}% match</div>` : ''}
                        ${item.caption ? `<div class="caption">${item.caption}</div>` : ''}
                        ${item.tags && item.tags.length > 0 ? `
                            <div class="tags">
                                ${item.tags.slice(0, 5).map(t => `<span class="tag">${t}</span>`).join('')}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `).join('');

            if (append) {
                resultsDiv.insertAdjacentHTML('beforeend', html);
            } else {
                resultsDiv.innerHTML = html;
            }
        }

        // Modal
        function openModal(index) {
            currentModalIndex = index;
            const item = currentItems[index];
            if (!item) return;
            document.getElementById('modalImg').src = '/api/image?path=' + encodeURIComponent(item.path);
            document.getElementById('modalCaption').textContent = item.caption || '';
            document.getElementById('modalPath').textContent = item.path;
            document.getElementById('modal').classList.add('active');
        }

        function closeModal(e) {
            if (e && e.target !== e.currentTarget && !e.target.classList.contains('modal-close')) return;
            document.getElementById('modal').classList.remove('active');
            currentModalIndex = -1;
        }

        function navModal(dir, e) {
            e.stopPropagation();
            const newIndex = currentModalIndex + dir;
            if (newIndex >= 0 && newIndex < currentItems.length) {
                openModal(newIndex);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal({target: document.getElementById('modal'), currentTarget: document.getElementById('modal')});
            if (e.key === 'ArrowLeft' && currentModalIndex > 0) navModal(-1, {stopPropagation:()=>{}});
            if (e.key === 'ArrowRight' && currentModalIndex < currentItems.length - 1) navModal(1, {stopPropagation:()=>{}});
        });

        // Task polling
        async function pollTasks() {
            try {
                const r = await fetch('/api/tasks');
                const d = await r.json();
                const tasks = d.tasks || [];

                if (tasks.length === 0) {
                    taskPanel.innerHTML = '';
                    return;
                }

                taskPanel.innerHTML = tasks.map(t => `
                    <div class="task-card">
                        <div class="task-header">
                            <span class="task-type">${t.type === 'index' ? '📥' : '🏷️'} ${t.type}</span>
                            <span class="task-status ${t.status}">${t.status}</span>
                        </div>
                        <div class="task-message">${t.message || 'Waiting...'}</div>
                        ${t.total > 0 ? `
                            <div class="task-progress-bar">
                                <div class="task-progress-fill" style="width:${t.percent}%"></div>
                            </div>
                        ` : ''}
                    </div>
                `).join('');
            } catch(e) {}
        }

        // --- Tab Navigation ---
        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            document.querySelector(`.tab-btn[onclick="switchTab('${tab}')"]`).classList.add('active');

            // Load data lazily
            if (tab === 'clusters') loadClusters();
            if (tab === 'timeline') loadTimeline();
        }

        // --- Clusters ---
        async function loadClusters() {
            const grid = document.getElementById('clustersGrid');
            try {
                const r = await fetch('/api/clusters');
                const d = await r.json();
                if (!d.clusters || d.clusters.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <h2>No Clusters Yet</h2>
                            <p>Run clustering to auto-group your images by visual similarity</p>
                            <button class="cluster-run-btn" onclick="runClustering()">🧩 Run Clustering</button>
                        </div>`;
                    return;
                }
                renderClusters(d.clusters);
            } catch(e) {
                grid.innerHTML = '<div class="empty-state"><h2>Error loading clusters</h2></div>';
            }
        }

        async function runClustering() {
            const grid = document.getElementById('clustersGrid');
            grid.innerHTML = '<div class="empty-state"><h2>Clustering... 🧩</h2><p>This may take a moment</p></div>';
            try {
                const r = await fetch('/api/clusters', {method: 'POST'});
                const d = await r.json();
                renderClusters(d.clusters || []);
            } catch(e) {
                grid.innerHTML = '<div class="empty-state"><h2>Error running clustering</h2></div>';
            }
        }

        function renderClusters(clusters) {
            const grid = document.getElementById('clustersGrid');
            grid.innerHTML = clusters.map(c => `
                <div class="cluster-group">
                    <div class="cluster-header">
                        <span class="cluster-label">${c.label || 'Group ' + c.id}</span>
                        <span class="cluster-count">${c.size} images</span>
                    </div>
                    <div class="cluster-images">
                        ${(c.images || []).slice(0, 20).map(img => {
                            const path = typeof img === 'string' ? img : img.path;
                            const thumb = '/api/thumbnail?path=' + encodeURIComponent(path);
                            return `<div class="result-card" onclick="openModalFromPath('${path.replace(/'/g, "\\'")}')">
                                <img src="${thumb}" loading="lazy">
                            </div>`;
                        }).join('')}
                    </div>
                </div>
            `).join('') + '<button class="cluster-run-btn" onclick="runClustering()">🔄 Re-cluster</button>';
        }

        function openModalFromPath(path) {
            document.getElementById('modalImg').src = '/api/image?path=' + encodeURIComponent(path);
            document.getElementById('modalCaption').textContent = '';
            document.getElementById('modalPath').textContent = path;
            document.getElementById('modal').classList.add('active');
        }

        // --- Chat ---
        const chatInput = document.getElementById('chatInput');
        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendChat();
        });

        async function sendChat() {
            const query = chatInput.value.trim();
            if (!query) return;

            const messages = document.getElementById('chatMessages');

            // Add user message
            messages.innerHTML += `<div class="chat-msg user"><div class="msg-text">${escapeHtml(query)}</div></div>`;
            chatInput.value = '';
            messages.scrollTop = messages.scrollHeight;

            // Add thinking indicator
            messages.innerHTML += `<div class="chat-msg assistant" id="chatThinking"><div class="msg-text">Searching... 🔍</div></div>`;
            messages.scrollTop = messages.scrollHeight;

            try {
                const r = await fetch('/api/chat?q=' + encodeURIComponent(query));
                const d = await r.json();

                // Remove thinking
                document.getElementById('chatThinking')?.remove();

                // Build response
                let imagesHtml = '';
                if (d.results && d.results.length > 0) {
                    imagesHtml = `<div class="msg-images">${d.results.slice(0, 6).map(r => {
                        const thumb = r.thumbnail || '/api/thumbnail?path=' + encodeURIComponent(r.path);
                        return `<img src="${thumb}" onclick="openModalFromPath('${r.path.replace(/'/g, "\\'")}')" loading="lazy">`;
                    }).join('')}</div>`;
                }

                messages.innerHTML += `
                    <div class="chat-msg assistant">
                        <div class="msg-text">${escapeHtml(d.summary)}</div>
                        ${imagesHtml}
                    </div>`;
                messages.scrollTop = messages.scrollHeight;
            } catch(e) {
                document.getElementById('chatThinking')?.remove();
                messages.innerHTML += `<div class="chat-msg assistant"><div class="msg-text">Search failed. Is the server running?</div></div>`;
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // --- Timeline ---
        async function loadTimeline() {
            const groupBy = document.getElementById('timelineGroup').value;
            const content = document.getElementById('timelineContent');
            content.innerHTML = '<div class="empty-state"><p>Loading timeline...</p></div>';

            try {
                const r = await fetch('/api/timeline?group_by=' + groupBy + '&limit=50');
                const d = await r.json();

                if (!d.groups || d.groups.length === 0) {
                    content.innerHTML = '<div class="empty-state"><h2>No dated images</h2><p>Images need EXIF dates or file dates to appear in the timeline</p></div>';
                    return;
                }

                content.innerHTML = d.groups.map(g => `
                    <div class="timeline-group">
                        <div class="timeline-dot"></div>
                        <div class="timeline-date">${g.date}</div>
                        <div class="timeline-count">${g.count} images</div>
                        <div class="timeline-images">
                            ${(g.images || []).map(img => {
                                const thumb = img.thumbnail || '/api/thumbnail?path=' + encodeURIComponent(img.path);
                                return `<div class="result-card" onclick="openModalFromPath('${img.path.replace(/'/g, "\\'")}')">
                                    <img src="${thumb}" loading="lazy">
                                </div>`;
                            }).join('')}
                        </div>
                    </div>
                `).join('');
            } catch(e) {
                content.innerHTML = '<div class="empty-state"><h2>Error loading timeline</h2></div>';
            }
        }
    </script>
</body>
</html>
