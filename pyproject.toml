[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eyra"
version = "0.1.0"
description = "Local-first AI image memory — turns any folder into a searchable visual knowledge base"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Athul Krishna", email = "aathulkrishnaa@gmail.com" }
]
keywords = ["image-search", "ai", "clip", "local-first", "semantic-search", "vision", "self-hosted"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
    "open-clip-torch>=2.20.0",
    "chromadb>=0.4.0",
    "Pillow>=10.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "watchdog>=3.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "jinja2>=3.1.0",
    "aiofiles>=23.0.0",
    "numpy>=1.24.0",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
    "scikit-learn>=1.3.0",
]

[project.optional-dependencies]
mlx = ["mlx>=0.5.0", "mlx-vlm>=0.0.5"]
dev = ["pytest>=7.0.0", "pytest-cov"]

[project.scripts]
eyra = "eyra.cli:app"

[project.urls]
Homepage = "https://github.com/4thul0krishn4/Eyra"
Repository = "https://github.com/4thul0krishn4/Eyra"
Issues = "https://github.com/4thul0krishn4/Eyra/issues"

[tool.hatch.build.targets.wheel]
packages = ["eyra"]
